<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MP121 Replay - Timeline Leaderboard</title>
  <script src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
  <style>
    body {
      background: #0d0d1f;
      color: #eee;
      font-family: sans-serif;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      color: #f39c12;
    }
    ul {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0;
      list-style: none;
    }
    li {
      display: flex;
      align-items: center;
      background: #1f1f3a;
      margin-bottom: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border-left: 6px solid #555;
      transition: all 0.4s ease;
    }
    li:nth-child(1) { border-color: gold; }
    li:nth-child(2) { border-color: silver; }
    li:nth-child(3) { border-color: #cd7f32; }

    .avatar {
      width: 40px;
      height: 40px;
      margin-right: 1rem;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #444;
    }
    .name {
      flex: 1;
      font-weight: bold;
    }
    .points {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>

  <script>
    document.addEventListener('alpine:init', async () => {
      try {
      const response = await fetch('/api/highlight-snapshots/121');
      const snapshotArray = await response.json();


      console.log('Snapshot Array:', snapshotArray);



      // Normalize: extract top 10 for each frame
      const timeline = snapshotArray.map(snapshot => {
        const board = snapshot?.data?.leaderboard || snapshot?.leaderboard || [];
        return board
          .slice()
          .sort((a, b) => b.masterpiecePoints - a.masterpiecePoints)
          .slice(0, 10)
          .map(p => ({
            name: p.profile.displayName,
            avatar: p.profile.avatarUrl,
            score: p.masterpiecePoints
          }));
      });



      console.log('Timeline frames', timeline.length);


      Alpine.store('timeline', timeline);
      Alpine.store('playbackTime', 0);

      setInterval(() => {
        let next = Alpine.store('playbackTime') + 1;
        if (next < Alpine.store('timeline').length) {
          Alpine.store('playbackTime', next);
        }
      }, 2000);
    }
    catch (error) {
      console.error('Error fetching snapshots:', error);
    }
    });
  </script>
</head>

<body x-data>
  <h1>🔥 MP121 Snapshot Replay</h1>
<ul>
  <template x-if="$store.timeline && $store.timeline.length">
    <template x-for="(player, index) in $store.timeline[$store.playbackTime]" :key="`${player.name}-${player.score}`">

      <li 
      x-transition
      x-bind:style="`transform: translateY(${index * 65}px); transition: transform 0.4s; position: absolute; left: 0; right: 0;`"
      class="player-bar"
      :class="index === 0 ? 'first' : index === 1 ? 'second' : index === 2 ? 'third' : ''">
        <img class="avatar" :src="resolveAvatar(player.avatar)" />
        <div class="name" x-text="`${index + 1}. ${player.name}`"></div>
        <div class="points" x-text="`${player.score} pts`"></div>
      </li>
    </template>
  </template>
  <template x-if="!$store.timeline || !$store.timeline.length">
    <li>Loading snapshots...</li>
  </template>
</ul style="position: relatative; height: 700px;">

  <div style="text-align:center;">
    <button @click="$store.playbackTime = 0">🔁 Restart</button>
    Frame: <span x-text="$store.playbackTime + 1"></span> /
    <span x-text="$store.timeline?.length || 0"></span>
  </div>

  <!-- Alpine helper for IPFS -->
  <script>


  function resolveAvatar(url) {
    if (!url) return 'asset/default-avatar.gif';
    if (url.startsWith('ipfs://')) return url.replace('ipfs://', 'https://ipfs.io/ipfs/');
    return url;
  }

  // Make it available globally to Alpine templates
  window.resolveAvatar = resolveAvatar;
 
 </script>
</body>
</html>
