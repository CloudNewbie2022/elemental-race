<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Alpine.js Leaderboard</title>
  <!-- Alpine.js v3 -->
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body 
  x-data="leaderboard()" 
  x-init="init()"
>

  <h1 x-text="masterpieceName || 'Leaderboard'"></h1>

  <!-- Leaderboard list for current “time” -->
  <ul>
    <template x-for="player in timeline[time] || []" :key="player.name">
      <li>
        <strong x-text="player.name"></strong>:
        <span x-text="player.score"></span> pts
      </li>
    </template>
  </ul>

  <!-- Controls -->
  <div style="margin-top:1em;">
    <button @click="prev()" :disabled="time === 0">Prev</button>
    <button @click="next()" :disabled="time >= timeline.length - 1">Next</button>
    <button @click="reset()">Reset</button>
    <span style="margin-left:1em;">
      Frame: <span x-text="time"></span> / <span x-text="timeline.length - 1"></span>
    </span>
  </div>

  <script>
    function leaderboard() {
      return {
        masterpieceName: null,
        timeline: [],    // will be an array of [ {name,score}… ]
        time: 0,

        async init() {
          try {
            const res = await fetch('/api/latest-snapshots')
            const snapshots = await res.json()
            // snapshots is [ { filename, data: { leaderboard: […] } }, … ]
            this.timeline = snapshots.map(item =>
              item.data.leaderboard.map(p => ({
                name: p.profile.displayName,
                score: p.masterpiecePoints
              }))
            )
            // Optionally grab the name from the latest snapshot
            if (snapshots.length && snapshots[0].data.masterpiece) {
              this.masterpieceName = snapshots[0].data.masterpiece.name
            }
          } catch (e) {
            console.error('Failed to load snapshots', e)
          }
        },

        next() {
          if (this.time < this.timeline.length - 1) this.time++
        },
        prev() {
          if (this.time > 0) this.time--
        },
        reset() {
          this.time = 0
        }
      }
    }
  </script>

</body>
</html>
